generated: '2026-08-06'
method: searched
source: >-
  FDA/USDA regulatory coverage of Believer Meats and live probes of believermeats.com
  (2026-08-06 web search + curl)
scope: >-
  Believer Meats published no API, so there are no API or cross-cutting technical
  standards to assert. What it was actually measured against is the US regulatory
  pathway for cell-cultivated meat and poultry, which it completed in 2025 - and
  which it then could not commercialize, because the company ceased operations in
  December 2025. That pathway is recorded here as the applicable regime. The
  API/protocol standards block below is recorded as not-applicable rather than
  false, so this file is never mistaken for a compliance posture the company did
  not claim.
company_status:
  operating: false
  ceased: '2025-12'
  evidence: >-
    Shutdown announced to staff on 2025-12-01 and disclosed publicly by the
    company's global VP of talent and HR; widely reported (FoodBev, MEAT+POULTRY,
    AgFunderNews, Times of Israel, Calcalist, Fast Company, Wilson Times). The
    Wilson, North Carolina plant closed and the contractor that built it filed suit
    over a reported USD 34 million unpaid balance. believermeats.com remains online
    but has not been republished since 2025-10-12 (Webflow "Last Published" comment).
regulatory_regime:
- id: fda-cell-cultured-food-premarket-consultation
  name: >-
    US FDA premarket consultation for food made from cultured animal cells
    (FDA/USDA 2019 joint framework)
  conforms: true
  status: granted
  evidence: >-
    FDA issued a "No Questions" letter for Believer Meats' cultivated chicken in
    2025, accepting that the cultivation process, inputs and finished product raised
    no safety concerns. Believer was reported as the fifth cultivated-meat company
    to clear the FDA step.
- id: usda-fsis-label-and-facility-approval
  name: USDA FSIS label approval and grant of inspection for cell-cultivated poultry
  conforms: true
  status: granted
  evidence: >-
    USDA cleared Believer Meats' cultivated chicken label and its Wilson, North
    Carolina production facility for operation, completing the second half of the
    US pathway and positioning the company to begin commercial sales.
  note: >-
    Approval was achieved but never exercised - the company ceased operations before
    commercial sale.
