aid: believer-meats
name: Believer Meats
description: 'Believer Meats is a cultivated-meat company founded in 2018 in Rehovot,
  Israel as Future Meat Technologies by Hebrew University bioengineer Yaakov Nahmias,
  rebranded to Believer Meats in November 2022 and later headquartered in the United
  States under CEO Gustavo Burger. It grew chicken, lamb and beef from animal cells
  in a continuous fermentation process rather than raising and slaughtering animals,
  raised roughly USD 390 million across a 2019 Series A and a 2021 USD 347 million
  Series B backed by Tyson Foods, ADM, Emerald Technology Ventures, Bits x Bites, Cibus
  Fund and Menora Mivtachim, and completed a 200,000 square-foot production plant in
  Wilson, North Carolina billed as the largest cultivated-meat facility in the world.
  In 2025 it received an FDA "No Questions" letter for its cultivated chicken followed
  by USDA label and facility clearance, and then ceased operations in December 2025
  after its largest investor withdrew. It was a food-biotechnology and manufacturing
  business rather than a software vendor: it published no developer portal, no API
  documentation, no SDKs and no machine-readable API contract, and its Webflow marketing
  site — last republished in October 2025 — now stands as an archive of a company that
  is no longer operating.'
